<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyHub - My Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7ff;
color:#172033;
}

nav{
background:white;
padding:18px 7%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #eee;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#2855e8;
}

nav a{
text-decoration:none;
font-weight:bold;
color:#172033;
}

.container{
max-width:700px;
margin:40px auto;
padding:20px;
}

.card{
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.avatar{
font-size:80px;
text-align:center;
}

h1{
text-align:center;
margin:15px;
}

.info{
margin-top:25px;
}

.row{
display:flex;
justify-content:space-between;
padding:15px;
border-bottom:1px solid #eee;
}

.label{
font-weight:bold;
}

.value{
color:#2855e8;
}

.btn{
margin-top:30px;
width:100%;
padding:15px;
background:#2855e8;
color:white;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
}

.btn:hover{
background:#173fc0;
}

footer{
margin-top:50px;
background:#172033;
color:white;
text-align:center;
padding:25px;
}

</style>

</head>

<body>

<nav>

<div class="logo">
Study<span>Hub</span>
</div>

<a href="index.html">🏠 Home</a>

</nav>

<div class="container">

<div class="card">

<div class="avatar">
👤
</div>

<h1>Student Profile</h1>

<div class="info">

<div class="row">
<span class="label">Email</span>
<span class="value" id="email">-</span>
</div>

<div class="row">
<span class="label">Quiz Score</span>
<span class="value" id="score">0/20</span>
</div>

<div class="row">
<span class="label">Percentage</span>
<span class="value" id="percentage">0%</span>
</div>

<div class="row">
<span class="label">Quiz Date</span>
<span class="value" id="date">-</span>
</div>

</div>

</div>

</div>

<footer>

© 2026 StudyHub | Learn • Practice • Succeed

</footer>

<script>

const currentUser =
localStorage.getItem("currentUser");

if(currentUser){

document.getElementById("email").textContent =
currentUser;

}

const result =
JSON.parse(
localStorage.getItem("studyHubQuizResult")
);

if(result){

document.getElementById("score").textContent =
result.score + "/" + result.total;

document.getElementById("percentage").textContent =
result.percentage + "%";

document.getElementById("date").textContent =
result.date;

}

</script>

</body>
</html>
