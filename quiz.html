<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyHub - Professional Quiz</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7ff;
    color:#172033;
}

nav{
    background:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #e5e7eb;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#2855e8;
}

nav a{
    text-decoration:none;
    color:#172033;
    font-weight:bold;
}

.container{
    max-width:750px;
    margin:45px auto;
    padding:0 20px;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header .icon{
    font-size:55px;
}

.header h1{
    font-size:40px;
    margin:10px 0;
}

.header h1 span{
    color:#2855e8;
}

.header p{
    color:#64748b;
}

.quiz-card{
    background:white;
    padding:32px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.top{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    font-weight:bold;
}

.progress{
    width:100%;
    height:10px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:30px;
}

.progress-fill{
    height:100%;
    width:5%;
    background:#2855e8;
    transition:.3s;
}

.level{
    display:inline-block;
    padding:7px 13px;
    border-radius:20px;
    background:#eef2ff;
    color:#2855e8;
    font-size:13px;
    font-weight:bold;
    margin-bottom:15px;
}

.question{
    font-size:23px;
    font-weight:bold;
    margin-bottom:20px;
}

.option{
    display:block;
    padding:15px;
    margin:12px 0;
    border:2px solid #e5e7eb;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}

.option:hover{
    border-color:#2855e8;
    background:#f5f7ff;
}

.option input{
    margin-right:10px;
}

.next-btn{
    width:100%;
    border:none;
    padding:15px;
    margin-top:20px;
    border-radius:12px;
    background:#2855e8;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.next-btn:hover{
    background:#173fc0;
}

#result{
    text-align:center;
    margin-top:20px;
    font-size:19px;
    font-weight:bold;
}

.result-box{
    display:none;
    text-align:center;
}

.result-box h2{
    font-size:32px;
    margin-bottom:15px;
}

.score{
    font-size:45px;
    font-weight:bold;
    color:#2855e8;
    margin:15px;
}

.result-box p{
    margin:8px;
    color:#64748b;
}

.retry,
.progress-btn{
    display:inline-block;
    margin:15px 5px;
    padding:13px 20px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

.retry{
    background:#2855e8;
    color:white;
    border:none;
    cursor:pointer;
}

.progress-btn{
    background:#eef2ff;
    color:#2855e8;
}

footer{
    background:#172033;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:50px;
}

@media(max-width:600px){
    .header h1{
        font-size:30px;
    }

    .quiz-card{
        padding:22px;
    }

    .question{
        font-size:20px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">
        Study<span>Hub</span>
    </div>

    <a href="index.html">🏠 Home</a>
</nav>

<div class="container">

    <div class="header">
        <div class="icon">🧠</div>
        <h1>StudyHub <span>Quiz</span></h1>
        <p>Challenge yourself and improve your knowledge.</p>
    </div>

    <div class="quiz-card">

        <div id="quizArea">

            <div class="top">
                <span id="questionNumber">Question 1 of 20</span>
                <span id="scoreText">Score: 0</span>
            </div>

            <div class="progress">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="level" id="level">Easy</div>

            <div class="question" id="question">
                Question
            </div>

            <div id="options"></div>

            <button class="next-btn" onclick="nextQuestion()">
                Next Question →
            </button>

            <div id="result"></div>

        </div>


        <div class="result-box" id="finalResult">

            <h2>🎉 Quiz Completed!</h2>

            <div class="score" id="finalScore">
                0/20
            </div>

            <p id="percentage"></p>
            <p id="correctText"></p>
            <p id="wrongText"></p>

            <button class="retry" onclick="restartQuiz()">
                🔄 Try Again
            </button>

            <a href="progress.html" class="progress-btn">
                📊 View Progress
            </a>

        </div>

    </div>

</div>

<footer>
    <p>© 2026 StudyHub | Learn • Practice • Succeed</p>
</footer>


<script>

const questions = [

/* EASY */

{
q:"What is 2 + 3?",
options:["4","5","6","7"],
answer:"5",
level:"Easy"
},

{
q:"How many days are there in one week?",
options:["5","6","7","8"],
answer:"7",
level:"Easy"
},

{
q:"Which planet do we live on?",
options:["Mars","Earth","Venus","Jupiter"],
answer:"Earth",
level:"Easy"
},

{
q:"What is the opposite of 'hot'?",
options:["Warm","Cold","Dry","Big"],
answer:"Cold",
level:"Easy"
},

{
q:"How many legs does a normal cat have?",
options:["2","3","4","6"],
answer:"4",
level:"Easy"
},

/* MEDIUM EASY */

{
q:"What is 12 × 3?",
options:["24","30","36","42"],
answer:"36",
level:"Easy"
},

{
q:"Which gas do humans need to breathe?",
options:["Oxygen","Helium","Hydrogen","Carbon dioxide"],
answer:"Oxygen",
level:"Easy"
},

{
q:"What is the capital of Pakistan?",
options:["Lahore","Karachi","Islamabad","Peshawar"],
answer:"Islamabad",
level:"Easy"
},

{
q:"Which organ pumps blood around the body?",
options:["Brain","Heart","Lung","Stomach"],
answer:"Heart",
level:"Medium"
},

{
q:"What is 100 ÷ 4?",
options:["20","25","30","40"],
answer:"25",
level:"Medium"
},

/* MEDIUM */

{
q:"Which part of a plant usually absorbs water from soil?",
options:["Flower","Leaf","Root","Fruit"],
answer:"Root",
level:"Medium"
},

{
q:"What is the chemical symbol for water?",
options:["CO2","O2","H2O","NaCl"],
answer:"H2O",
level:"Medium"
},

{
q:"Which force pulls objects toward Earth?",
options:["Friction","Gravity","Magnetism","Sound"],
answer:"Gravity",
level:"Medium"
},

{
q:"What is 15 × 4?",
options:["45","50","60","75"],
answer:"60",
level:"Medium"
},

{
q:"Which is the largest planet in our solar system?",
options:["Earth","Mars","Jupiter","Venus"],
answer:"Jupiter",
level:"Medium"
},

/* HARD */

{
q:"What is 25% of 200?",
options:["25","40","50","75"],
answer:"50",
level:"Hard"
},

{
q:"Which organ is mainly responsible for thinking?",
options:["Heart","Brain","Liver","Kidney"],
answer:"Brain",
level:"Hard"
},

{
q:"What is the formula for speed?",
options:[
"Distance × Time",
"Distance ÷ Time",
"Time ÷ Distance",
"Distance + Time"
],
answer:"Distance ÷ Time",
level:"Hard"
},

{
q:"What is 12²?",
options:["124","134","144","154"],
answer:"144",
level:"Hard"
},

{
q:"If a car travels 120 km in 2 hours, what is its average speed?",
options:["40 km/h","50 km/h","60 km/h","80 km/h"],
answer:"60 km/h",
level:"Hard"
}

];


let currentQuestion = 0;
let score = 0;
let answered = false;


function loadQuestion(){

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    document.getElementById("scoreText").textContent =
        "Score: " + score;

    document.getElementById("progressFill").style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

    document.getElementById("level").textContent =
        q.level;

    document.getElementById("question").textContent =
        q.q;

    document.getElementById("result").textContent = "";

    const options = document.getElementById("options");

    options.innerHTML = "";

    q.options.forEach(function(option){

        const label = document.createElement("label");

        label.className = "option";

        label.innerHTML = `
            <input type="radio" name="answer" value="${option}">
            ${option}
        `;

        options.appendChild(label);

    });

}


function nextQuestion(){

    if(answered){
        return;
    }

    const selected =
        document.querySelector('input[name="answer"]:checked');

    const result =
        document.getElementById("result");

    if(!selected){

        result.textContent =
            "⚠️ Please select an answer.";

        return;
    }

    answered = true;

    if(selected.value === questions[currentQuestion].answer){

        score++;

        result.textContent =
            "✅ Correct!";

    }else{

        result.textContent =
            "❌ Wrong! Correct answer: " +
            questions[currentQuestion].answer;

    }

    setTimeout(function(){

        currentQuestion++;

        if(currentQuestion < questions.length){

            loadQuestion();

        }else{

            finishQuiz();

        }

    },800);

}


function finishQuiz(){

    document.getElementById("quizArea").style.display =
        "none";

    document.getElementById("finalResult").style.display =
        "block";

    const total = questions.length;

    const percentage =
        Math.round((score / total) * 100);

    document.getElementById("finalScore").textContent =
        score + "/" + total;

    document.getElementById("percentage").textContent =
        "📊 Percentage: " + percentage + "%";

    document.getElementById("correctText").textContent =
        "✅ Correct Answers: " + score;

    document.getElementById("wrongText").textContent =
        "❌ Wrong Answers: " + (total - score);


    /* Save result */

    const quizResult = {

        score:score,

        total:total,

        percentage:percentage,

        date:new Date().toLocaleString()

    };

    const currentUser = localStorage.getItem("currentUser");

if (currentUser) {

    const historyKey = "quizHistory_" + currentUser;

    let history =
        JSON.parse(localStorage.getItem(historyKey)) || [];

    history.push(quizResult);

    localStorage.setItem(
        historyKey,
        JSON.stringify(history)
    );
}

}


function restartQuiz(){

    currentQuestion = 0;

    score = 0;

    document.getElementById("quizArea").style.display =
        "block";

    document.getElementById("finalResult").style.display =
        "none";

    loadQuestion();

}


loadQuestion();

</script>

</body>
</html>
