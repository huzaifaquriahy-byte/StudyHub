<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyHub - Sign Up</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7ff;
    color:#172033;
}

nav{
    background:white;
    padding:20px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #eee;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:#2855e8;
}

nav a{
    text-decoration:none;
    color:#172033;
    font-weight:bold;
}

.signup-container{
    min-height:75vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.signup-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.signup-icon{
    text-align:center;
    font-size:55px;
}

h1{
    text-align:center;
    margin:15px 0 8px;
}

h1 span{
    color:#2855e8;
}

.subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:30px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:20px;
    border:1px solid #d9deea;
    border-radius:10px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#2855e8;
}

.signup-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2855e8;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.signup-btn:hover{
    background:#173fc0;
}

.login-link{
    text-align:center;
    margin-top:20px;
    color:#667085;
}

.login-link a{
    color:#2855e8;
    font-weight:bold;
    text-decoration:none;
}

#message{
    text-align:center;
    margin-top:20px;
    font-weight:bold;
}

footer{
    background:#172033;
    color:white;
    text-align:center;
    padding:25px;
}
</style>
</head>

<body>

<nav>

    <div class="logo">
        Study<span>Hub</span>
    </div>

    <a href="index.html">🏠 Home</a>

</nav>


<div class="signup-container">

    <div class="signup-box">

        <div class="signup-icon">👤</div>

        <h1>Create <span>Account</span></h1>

        <p class="subtitle">
            Join StudyHub and start learning.
        </p>


        <form onsubmit="createAccount(event)">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="signup-btn">
                Create Account 🚀
            </button>

        </form>

        <div id="message"></div>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<footer>

    <p>
        © 2026 StudyHub | Learn • Practice • Succeed
    </p>

</footer>


<script>

function createAccount(event){

    event.preventDefault();


    const name =
        document.getElementById("name")
        .value
        .trim();

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("password")
        .value;


    const message =
        document.getElementById("message");


    /* Get existing accounts */

    let accounts =
        JSON.parse(
            localStorage.getItem("studyHubAccounts")
        ) || [];


    /* Check existing email */

    const existingAccount =
        accounts.find(function(user){

            return user.email === email;

        });


    if(existingAccount){

        message.style.color = "#dc2626";

        message.textContent =
            "❌ This email already has an account.";

        return;
    }


    /* Create account with NAME */

    const newAccount = {

        name: name,

        email: email,

        password: password

    };


    /* Save account */

    accounts.push(newAccount);

    localStorage.setItem(
        "studyHubAccounts",
        JSON.stringify(accounts)
    );


    /* Save current student */

    localStorage.setItem(
        "studyHubCurrentUser",
        JSON.stringify(newAccount)
    );

    localStorage.setItem(
        "currentUser",
        email
    );


    /* Success */

    message.style.color = "#16a34a";

    message.textContent =
        "🎉 Account created successfully!";


    /* Go Home */

    setTimeout(function(){

        window.location.href =
            "index.html";

    },1000);

}

</script>

</body>
</html>
